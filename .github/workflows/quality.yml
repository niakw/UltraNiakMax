name: Fork regression and privacy checks

on:
  push:
    branches: [main]
    paths:
      - index.js
      - configure.html
      - services/**
      - utils/**
      - test/**
      - package.json
      - package-lock.json
      - deployment/eitty/**
      - .github/workflows/quality.yml
  pull_request:
    paths:
      - index.js
      - configure.html
      - services/**
      - utils/**
      - test/**
      - package.json
      - package-lock.json
      - deployment/eitty/**
      - .github/workflows/quality.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check JavaScript syntax
        run: |
          node --check index.js
          node --check utils/search-exclusion.js
          node --check deployment/eitty/patch-upstream.cjs
      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run fork regression tests (including search exclusion)
        run: npm test
