name: Refresh dependency lockfile

on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/refresh-lockfile.yml

permissions:
  contents: write

concurrency:
  group: dependency-lockfile-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Safely synchronize and regenerate lockfile from current main
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            if git diff --quiet -- package-lock.json; then
              echo "Lockfile already in sync with current main"
              exit 0
            fi
            git add package-lock.json
            git commit -m "build(security): refresh locked dependencies [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent main update; resynchronizing before retry"
            sleep 1
          done
          echo "::error::Could not publish lockfile after 5 safe retries"
          exit 1
