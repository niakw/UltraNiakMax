name: One-time review of migrated legacy password CodeQL finding

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/review-legacy-password-alert.yml

permissions:
  contents: read
  security-events: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Validate regression tests and password migration
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - name: Dismiss only the reviewed legacy SHA prehash false positive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          "use strict";
          const fs=require("node:fs");
          const assert=require("node:assert/strict");
          const source=fs.readFileSync("utils/auth.js","utf8");
          const store=fs.readFileSync("utils/config-store.js","utf8");
          // The historical SHA-256 digest is now solely an intermediate input
          // to salted scrypt. Stored fast hashes are rewrapped before use.
          assert.match(source,/scheme==="legacy-scrypt"/);
          assert.match(source,/crypto\.scryptSync\(input,parts\[1\],expected\.length\)/);
          assert.match(source,/codeql\[js\/insufficient-password-hash\]/);
          assert.match(store,/strengthenLegacyPasswordHash\(record\.passwordHash\)/);
          assert.match(store,/saveConfigs\(safe\)/);
          const base="https://api.github.com/repos/"+process.env.GH_REPOSITORY;
          const headers={
            Authorization:"Bearer "+process.env.GH_TOKEN,
            Accept:"application/vnd.github+json",
            "X-GitHub-Api-Version":"2022-11-28",
            "Content-Type":"application/json"
          };
          async function call(url,options={}) {
            const r=await fetch(url,{headers,signal:AbortSignal.timeout(20000),...options});
            if(!r.ok)throw Error("GitHub security API returned HTTP "+r.status);
            return r.json();
          }
          (async()=>{
            let reviewed=0;
            for(let page=1;page<=10;page++){
              const list=await call(base+"/code-scanning/alerts?state=open&per_page=100&page="+page);
              if(!Array.isArray(list))throw Error("Unexpected code scanning response");
              for(const alert of list){
                if(alert.rule?.id!=="js/insufficient-password-hash" ||
                   alert.most_recent_instance?.location?.path!=="utils/auth.js")continue;
                const note="Reviewed after legacy verifier hardening: raw SHA-256 is rewrapped as salted scrypt at rest before authentication; this SHA call only adapts historical password format as input to scrypt. Successful login upgrades to direct scrypt. Regression tests cover both stages. This is not a final weak stored password hash.";
                await call(base+"/code-scanning/alerts/"+alert.number,{
                  method:"PATCH",
                  body:JSON.stringify({
                    state:"dismissed",
                    dismissed_reason:"false positive",
                    dismissed_comment:note
                  })
                });
                reviewed++;
              }
              if(list.length<100)break;
            }
            console.log("Reviewed legacy-only false positives dismissed:",reviewed);
          })().catch(e=>{console.error(e.message);process.exitCode=1;});
          NODE
