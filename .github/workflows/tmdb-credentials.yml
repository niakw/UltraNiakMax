name: Verify TMDB credentials

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/tmdb-credentials.yml

permissions:
  contents: read

jobs:
  credentials:
    name: TMDB v3 and read-only v4 token check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TMDB_API: ${{ secrets.TMDB_API }}
      TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
    steps:
      - name: Check both GitHub secrets without exposing values
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TMDB_API}" || -z "${TMDB_TOKEN}" ]]; then
            echo "::error::TMDB_API or TMDB_TOKEN secret is missing."
            exit 1
          fi
          echo "Both TMDB secrets are populated (values withheld)."
      - name: Validate TMDB v3 API key and v4 bearer token
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert = require("node:assert/strict");
          const timeout = AbortSignal.timeout(15000);
          async function verify(label, options) {
            const response = await fetch("https://api.themoviedb.org/3/configuration" + (options.query || ""), {
              headers: options.headers || {},
              signal: timeout,
              redirect: "error"
            });
            if (!response.ok) {
              console.error(label + ": HTTP " + response.status + " (secret not displayed)");
              process.exitCode = 1;
              return;
            }
            const body = await response.json();
            assert.ok(body.images?.secure_base_url, label + ": invalid TMDB response");
            console.log(label + " verified successfully.");
          }
          (async () => {
            await verify("TMDB_API (v3)", { query: "?api_key=" + encodeURIComponent(process.env.TMDB_API) });
            await verify("TMDB_TOKEN (bearer)", { headers: { Authorization: "Bearer " + process.env.TMDB_TOKEN } });
          })().catch(error => {
            console.error("TMDB validation failed: " + error.message);
            process.exitCode = 1;
          });
          NODE
