services:
  ultramax:
    build: .
    image: ultramax-niakw:local
    container_name: ultramax-niakw
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "7000"
      CONFIGS_FILE: /app/data/configs.json
      IMAGES_DIR: /app/images
    ports:
      - "127.0.0.1:${HOST_PORT:-7000}:7000"
    volumes:
      - ultramax-data:/app/data
      - ultramax-images:/app/images
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:http').get('http://127.0.0.1:7000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  ultramax-data:
  ultramax-images:
